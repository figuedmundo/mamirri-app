<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Generator</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: system-ui, sans-serif;
        background: #f0f0f0;
      }
      .container {
        margin-bottom: 20px;
        display: inline-block;
        position: relative;
      }
      .label {
        margin-bottom: 5px;
        font-size: 12px;
        color: #666;
      }

      /* Shared SVG Styles */
      svg {
        width: 100%;
        height: 100%;
      }

      /* Standard Icon (Square) */
      #icon-standard {
        width: 512px;
        height: 512px;
        background: transparent;
      }

      /* Maskable Icon (Safe Zone Padding) */
      /* Safe zone is typically inner 80% */
      #icon-maskable {
        width: 512px;
        height: 512px;
        background: #2d9f8e;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #icon-maskable svg {
        width: 80%;
        height: 80%;
      }
      /* Override rect radius for maskable to be full bleed background if needed, 
           but our logo has a rounded rect. For maskable, we should probably remove the rounded rect 
           and just have the symbol on the full background. 
           Let's modify the SVG for maskable inline. */

      /* Screenshots */
      .screenshot {
        background: #2d9f8e;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .screenshot h1 {
        font-size: 48px;
        margin: 0 0 20px 0;
      }
      .screenshot p {
        font-size: 24px;
        opacity: 0.9;
        max-width: 80%;
        margin: 0;
      }
      .screenshot svg {
        width: 120px;
        height: 120px;
        margin-bottom: 30px;
      }

      #screenshot-wide {
        width: 1280px;
        height: 720px;
      }
      #screenshot-narrow {
        width: 720px;
        height: 1280px;
      }

      /* Decorative circles for screenshots */
      .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="label">Standard Icon (512x512)</div>
      <div id="icon-standard">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #2d9f8e; stop-opacity: 1" />
              <stop
                offset="100%"
                style="stop-color: #237a6d; stop-opacity: 1"
              />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="128" fill="url(#grad1)" />
          <path
            d="M140 360V152l116 116 116-116v208"
            stroke="white"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </div>
    </div>

    <div class="container">
      <div class="label">Icon 192 (192x192)</div>
      <div id="icon-192" style="width: 192px; height: 192px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #2d9f8e; stop-opacity: 1" />
              <stop
                offset="100%"
                style="stop-color: #237a6d; stop-opacity: 1"
              />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="128" fill="url(#grad2)" />
          <path
            d="M140 360V152l116 116 116-116v208"
            stroke="white"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </div>
    </div>

    <div class="container">
      <div class="label">Icon 180 (Apple Touch)</div>
      <div id="icon-180" style="width: 180px; height: 180px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #2d9f8e; stop-opacity: 1" />
              <stop
                offset="100%"
                style="stop-color: #237a6d; stop-opacity: 1"
              />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="128" fill="url(#grad3)" />
          <path
            d="M140 360V152l116 116 116-116v208"
            stroke="white"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </div>
    </div>

    <div class="container">
      <div class="label">Favicon (32x32)</div>
      <div id="icon-32" style="width: 32px; height: 32px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #2d9f8e; stop-opacity: 1" />
              <stop
                offset="100%"
                style="stop-color: #237a6d; stop-opacity: 1"
              />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="128" fill="url(#grad4)" />
          <path
            d="M140 360V152l116 116 116-116v208"
            stroke="white"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </div>
    </div>

    <div class="container">
      <div class="label">Maskable Icon (512x512)</div>
      <div id="icon-maskable">
        <!-- Logo Symbol Only (No background rect, background is CSS) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path
            d="M140 360V152l116 116 116-116v208"
            stroke="white"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </div>
    </div>

    <div class="container">
      <div class="label">Screenshot Wide (1280x720)</div>
      <div id="screenshot-wide" class="screenshot">
        <div
          class="circle"
          style="width: 400px; height: 400px; top: -100px; right: -100px"
        ></div>
        <div
          class="circle"
          style="width: 200px; height: 200px; bottom: 50px; left: 50px"
        ></div>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path
            d="M140 360V152l116 116 116-116v208"
            stroke="white"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
        <h1>Mamirri</h1>
        <p>Your Intelligent Clinical Assistant</p>
      </div>
    </div>

    <div class="container">
      <div class="label">Screenshot Narrow (720x1280)</div>
      <div id="screenshot-narrow" class="screenshot">
        <div
          class="circle"
          style="width: 300px; height: 300px; top: 100px; left: -100px"
        ></div>
        <div
          class="circle"
          style="width: 500px; height: 500px; bottom: -150px; right: -150px"
        ></div>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path
            d="M140 360V152l116 116 116-116v208"
            stroke="white"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
        <h1>Seamless Documentation</h1>
        <p>Manage patients, treatments, and sessions with ease.</p>
      </div>
    </div>
  </body>
</html>
