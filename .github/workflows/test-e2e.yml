name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for testing
        run: |
          cp .env.example .env
          # Ensure essential variables are set for E2E
          echo "JWT_SECRET=test_secret" >> .env
          echo "DATABASE_URL=postgresql://physio_user:physio_password_change_me@localhost:5432/physio_db" >> .env

      - name: Start Infrastructure Services
        run: docker compose up -d postgres minio redis

      - name: Wait for Services Health
        run: |
          echo "Waiting for services to be healthy..."
          # Wait for Postgres
          for i in {1..30}; do
            if docker exec physio_db pg_isready -U physio_user -d physio_db; then
              echo "Postgres is ready!"
              break
            fi
            echo "Waiting for postgres..."
            sleep 2
          done

          # Wait for MinIO
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready!"
              break
            fi
            echo "Waiting for MinIO..."
            sleep 2
          done

      - name: Run Prisma Migrations
        run: pnpm --filter server exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://physio_user:physio_password_change_me@localhost:5432/physio_db

      - name: Run E2E Tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: postgresql://physio_user:physio_password_change_me@localhost:5432/physio_db
          JWT_SECRET: test_secret

      - name: Stop Services
        if: always()
        run: docker compose down
