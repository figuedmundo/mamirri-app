name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET || 'test_secret_for_ci_only' }}
  TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://physio_user:physio_password_change_me@localhost:5432/physio_db' }}
  TEST_REDIS_PASSWORD: ${{ secrets.TEST_REDIS_PASSWORD || '' }}

jobs:
  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter client exec playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        run: pnpm --filter client exec playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright dependencies
        run: pnpm --filter client exec playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate

      - name: Build applications
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ env.TEST_JWT_SECRET }}

      - name: Create .env for testing
        run: |
          cp .env.example .env
          # Ensure essential variables are set for E2E
          echo "JWT_SECRET=${{ env.TEST_JWT_SECRET }}" >> .env
          echo "DATABASE_URL=${{ env.TEST_DATABASE_URL }}" >> .env
          echo "REDIS_PASSWORD=${{ env.TEST_REDIS_PASSWORD }}" >> .env

      - name: Start Infrastructure Services
        run: docker compose up -d postgres minio redis

      - name: Wait for Services Health
        run: |
          echo "Waiting for services to be healthy..."
          # Wait for Postgres
          for i in {1..30}; do
            if docker exec physio_db pg_isready -U physio_user -d physio_db; then
              echo "Postgres is ready!"
              break
            fi
            echo "Waiting for postgres..."
            sleep 2
          done

          # Wait for MinIO
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready!"
              break
            fi
            echo "Waiting for MinIO..."
            sleep 2
          done

          # Wait for Redis
          for i in {1..30}; do
            if docker exec physio_cache redis-cli ping | grep -q "PONG"; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Run Prisma Migrations
        run: pnpm --filter server exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run E2E Tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ env.TEST_JWT_SECRET }}

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/client/playwright-report/
            apps/client/test-results/
          retention-days: 30

      - name: Stop Services
        if: always()
        run: docker compose down
