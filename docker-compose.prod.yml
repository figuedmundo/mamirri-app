services:
  # PostgreSQL with pgvector for Phase 3
  postgres:
    image: ankane/pgvector:latest
    container_name: physio_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./backups:/backups:ro
    networks:
      - homelab_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: physio_storage
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - homelab_net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: physio_cache
    volumes:
      - redis_data:/data
    networks:
      - homelab_net
    restart: unless-stopped

  minio-provisioner:
    image: minio/mc:latest
    container_name: physio_provisioner
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb local/${MINIO_BUCKET} || true;
      /usr/bin/mc anonymous set public local/${MINIO_BUCKET};
      exit 0;
      "
    networks:
      - homelab_net

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: physio_server
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: 'false'
      GROQ_API_KEY: ${GROQ_API_KEY}
      NODE_ENV: production
      SERVER_HOST: ${SERVER_HOST:-localhost}
      SEED_DATABASE: ${SEED_DATABASE:-false}
    volumes:
      - ./backups:/backups:ro
    depends_on:
      - postgres
      - minio-provisioner
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - homelab_net

  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    container_name: physio_client
    environment:
      NODE_ENV: production
      API_URL: http://server:3000
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', '--timeout=5', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    depends_on:
      - server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - homelab_net

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  homelab_net:
    driver: bridge
