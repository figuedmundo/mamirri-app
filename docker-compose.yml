services:
  # PostgreSQL with pgvector for Phase 3
  postgres:
    image: ankane/pgvector:latest
    container_name: physio_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - physio_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Log rotation for development (smaller limits)
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: physio_storage
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PORT}:9000' # API
      - '${MINIO_CONSOLE_PORT}:9001' # Console
    volumes:
      - minio_data:/data
    networks:
      - physio_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    # Log rotation for development (smaller limits)
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  # Redis (Optional - for caching/sessions in future)
  redis:
    image: redis:7-alpine
    container_name: physio_cache
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - physio_network
    restart: unless-stopped
    # Log rotation for development (smaller limits)
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '2'

  minio-provisioner:
    image: minio/mc:latest
    container_name: physio_provisioner
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb local/${MINIO_BUCKET} || true;
      /usr/bin/mc anonymous set public local/${MINIO_BUCKET};
      exit 0;
      "
    networks:
      - physio_network

  # server:
  #   build:
  #     context: .
  #     dockerfile: docker/server/Dockerfile
  #   container_name: physio_server
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #     JWT_SECRET: ${JWT_SECRET}
  #     JWT_EXPIRATION: ${JWT_EXPIRATION}
  #     MINIO_ENDPOINT: minio
  #     MINIO_PORT: 9000
  #     MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  #     MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  #     MINIO_BUCKET: ${MINIO_BUCKET}
  #     MINIO_USE_SSL: 'false'
  #   ports:
  #     - '${SERVER_PORT}:3000'
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     minio-provisioner:
  #       condition: service_completed_successfully
  #   networks:
  #     - physio_network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  physio_network:
    driver: bridge
